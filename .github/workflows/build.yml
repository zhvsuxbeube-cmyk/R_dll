name: Build rdpwrap.dll

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Build both x86 and x64 DLLs on a Windows runner
  # -------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit — primary target
          - target: x86_64-pc-windows-msvc
            artifact_name: rdpwrap_x64.dll
            dll_name:       rdpwrap.dll

          # 32-bit — for legacy Windows installations
          - target: i686-pc-windows-msvc
            artifact_name: rdpwrap_x86.dll
            dll_name:       rdpwrap.dll

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Install Rust toolchain (stable) + the cross-compilation target
      # -----------------------------------------------------------------------
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # 3. Cache Cargo registry + build artefacts
      # -----------------------------------------------------------------------
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      # -----------------------------------------------------------------------
      # 4. Build in release mode
      # -----------------------------------------------------------------------
      - name: Build release DLL
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      # -----------------------------------------------------------------------
      # 5. Rename the output DLL so both artifacts have distinct names
      # -----------------------------------------------------------------------
      - name: Rename output artifact
        shell: pwsh
        run: |
          $src = "target\${{ matrix.target }}\release\${{ matrix.dll_name }}"
          $dst = "${{ matrix.artifact_name }}"
          Copy-Item -Path $src -Destination $dst -Force
          Write-Host "Copied $src -> $dst"
          Get-Item $dst | Select-Object Name, Length, LastWriteTime

      # -----------------------------------------------------------------------
      # 6. Upload per-target artifact
      # -----------------------------------------------------------------------
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Collect both DLLs into a single release ZIP
  # -------------------------------------------------------------------------
  package:
    name: Package release bundle
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 DLL
        uses: actions/download-artifact@v4
        with:
          name: rdpwrap_x64.dll
          path: dist/

      - name: Download x86 DLL
        uses: actions/download-artifact@v4
        with:
          name: rdpwrap_x86.dll
          path: dist/

      - name: Create release bundle ZIP
        run: |
          cd dist
          zip -j ../rdpwrap-rust-${{ github.ref_name }}.zip ./*
          cd ..
          ls -lh rdpwrap-rust-*.zip

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpwrap-rust-bundle
          path: rdpwrap-rust-*.zip
          if-no-files-found: error
          retention-days: 90

      # -----------------------------------------------------------------------
      # Publish a GitHub Release when triggered by a version tag
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rdpwrap-rust-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
